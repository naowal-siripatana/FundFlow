name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore FundFlow.slnx

      - name: Build
        run: dotnet build FundFlow.slnx --no-restore -c Release

      - name: Test
        run: dotnet test FundFlow.slnx --no-build -c Release --logger "console;verbosity=normal"

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f src/FundFlow.Api/Dockerfile -t fundflow-api .
      - name: Build Worker image
        run: docker build -f src/FundFlow.Worker/Dockerfile -t fundflow-worker .
